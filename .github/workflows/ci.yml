name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Allow a manual run (e.g. to re-verify main if a push event is ever missed).
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines >= 20; ESLint 10 requires >= 20.19, so use the latest patch of each line.
        node-version: ['20.x', '22.x', '24.x']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: CLI smoke test
        run: node bin/cli-five.mjs --help
