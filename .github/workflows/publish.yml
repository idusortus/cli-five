name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm Trusted Publishing (OIDC)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # npm Trusted Publishing requires npm >= 11.5.1 and Node >= 22.14.0
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Bump patch version with conflict detection
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          npm version patch --no-git-tag-version
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$PKG_NAME@$LOCAL_VERSION" version 2>/dev/null || echo "")
          ATTEMPTS=0
          MAX_ATTEMPTS=10
          while [ -n "$PUBLISHED" ]; do
            ATTEMPTS=$((ATTEMPTS + 1))
            if [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]; then
              echo "Error: could not find an unpublished version after $MAX_ATTEMPTS bumps."
              exit 1
            fi
            echo "Version $LOCAL_VERSION already published on npm — bumping again (attempt $ATTEMPTS)..."
            npm version patch --no-git-tag-version
            LOCAL_VERSION=$(node -p "require('./package.json').version")
            PUBLISHED=$(npm view "$PKG_NAME@$LOCAL_VERSION" version 2>/dev/null || echo "")
          done
          echo "Will publish version: $LOCAL_VERSION"

      - name: Diagnose OIDC (no secrets printed)
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL present: $([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo yes || echo no)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            OIDC=$(curl -sS \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
              | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')
            echo "GitHub OIDC token retrieved: $([ -n "$OIDC" ] && echo yes || echo no)"
            EX=$(curl -sS -o /tmp/exchange.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $OIDC" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/cli-five")
            echo "npm OIDC exchange HTTP: ${EX}"
            if [ "${EX}" != "200" ]; then
              echo "npm OIDC exchange error: $(head -c 500 /tmp/exchange.json)"
            else
              echo "npm OIDC exchange succeeded (token hidden)"
            fi
          fi
          echo "npmrc keys:"; grep -oE '^[^=]+' "${NPM_CONFIG_USERCONFIG:-/dev/null}" 2>/dev/null || true

      - name: Publish to npm
        # npm Trusted Publishing (OIDC). actions/setup-node writes an
        # `_authToken` line into the user .npmrc; remove it so npm does not
        # fall back to a stale token and instead exchanges the OIDC token.
        run: |
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi
          npm publish --access public --loglevel verbose

      - name: Commit and push version bump
        run: |
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: bump patch version [skip ci]"
          git push
